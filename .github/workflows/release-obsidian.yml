name: Package Obsidian release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify product tag
        run: node -e 'const pkg = require("./package.json"); if (process.env.GITHUB_REF_NAME !== pkg.version) throw new Error("Release tag must equal product version")'
      - run: npm ci
      - run: npm run validate:all
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          apps/obsidian/dist/main.js
          apps/obsidian/dist/manifest.json
          apps/obsidian/dist/styles.css
          apps/obsidian/dist/versions.json
          apps/obsidian/dist/build-info.json
          apps/obsidian/dist/SHA256SUMS.txt
          apps/obsidian/dist/markpage-*.zip
          --verify-tag --draft --title "MarkPage $GITHUB_REF_NAME"
          --notes-file apps/obsidian/RELEASE_NOTES.md
